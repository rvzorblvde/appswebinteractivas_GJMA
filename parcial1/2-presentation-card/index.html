<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--CDN de Bootsrap 5-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Tarjeta de Presentación</title>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 bg-light p-3">
    <div class="card border border-primary rounded-4 text-center p-4 w-100" style="max-width: 380px;">
        <div class="card-body p-0">
            <img src="/assets/images/profile-pic.jpg" alt="Foto de perfil" class="rounded-circle shadow mb-3" width="100" height="100">
            <p class="h4 fw-bold text-primary mb-1">Guillermo Muñoz Amaro</p>
            <p class="text-muted small mb-3">Desarrollador</p>

            <div class="d-flex flex-wrap justify-content-center gap-1 mb-4">
                <span class="badge bg-primary">Java</span>
                <span class="badge bg-success">SQL</span>
                <span class="badge bg-danger">C</span>
                <span class="badge bg-info text-white">Python</span>
                <span class="badge bg-dark">Bash</span>
            </div>

            <button type="button" class="btn btn-outline-primary w-100">
                <i class="bi bi-envelope me-1"></i>
                Contactar
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> 
</body>
</html>
